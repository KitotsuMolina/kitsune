# Core
backend=gpu
spectrum_mode=group
group_file=geometry-per-layer-test.group
group_poll_ms=400
mode=bars
runtime_mode=standard
monitor=DP-1
monitor_fallback_enabled=1
monitor_fallback_prefer_focused=1
monitor_fallback_check_seconds=2
output_target=layer-shell
width=1920
height=1080
fps=40
bars=240
bar_width=8
bar_gap=3
bar_corner_radius=4
segmented_bars=0
segment_length=12
segment_gap=6
line_max_height_ratio=0.58
bars_anchor=bottom
bars_direction=up
ring_inner_ratio=0.20
ring_length_ratio=0.22
bars_style=waves_fill
ring_style=waves_fill
bars_wave_thickness=3
bars_dot_radius=2
ring_wave_thickness=2
ring_dot_radius=2
bars_wave_roundness=0.70
ring_wave_roundness=0.65
ring_fill_softness=0.35
ring_fill_overlap_px=1.80
postfx_enabled=1
postfx_scope=mixed
postfx_blur_passes=1
postfx_blur_mix=0.18
postfx_glow_strength=1.35
postfx_glow_mix=0.24
postfx_skip_plain_bars=1
neon_enabled=1
neon_strength=1.20
neon_layers=3
afterglow_enabled=1
afterglow_decay=0.80
afterglow_alpha=0.24
particles_enabled=1
particles_max=220
particles_spawn_rate=42
particles_life_min=0.45
particles_life_max=1.45
particles_speed_min=24
particles_speed_max=96
particles_size_min=1
particles_size_max=2.4
particles_mode=bars_base
particles_size_scale=1.00
particles_alpha=0.62
particles_drift=28
particles_fade_jitter=0.35
particles_layer=back
particles_color=#FFFFFF
particles_color_mode=accent_mid
particles_glow_strength=1.20
base_light_enabled=1
base_light_height=26
base_light_alpha=0.34
base_light_color=#19f0ff
base_light_color_mode=accent_light

# FIFOs
fifo_video=/tmp/kitsune-spectrum.rgba
fifo_cava=/tmp/cava-rs.raw

# Look
color=#ff2f8f
color2=#19f0ff
dynamic_color=1
color_mode=accent_mid
color2_mode=accent_light
color_source_file=/tmp/kitsune-accent.hex
color_palette_file=/tmp/kitsune-accent.palette
dynamic_contrast_guard=1
dynamic_contrast_threshold=0.72
palette_role_method=rgb_b
accent_light_target_luma=0.86
accent_mid_target_luma=0.60
accent_dark_target_luma=0.30
color_poll_seconds=10
color_smooth=0.25
color_instant_apply=1
ring_auto_hide=1
ring_show_threshold=0.030
ring_hide_threshold=0.012
ring_fade_in_sec=0.25
ring_fade_out_sec=0.85

# Rotation (profile swap during playback)
rotate_profiles=1
rotation_seconds=10
static_profile=ring_video_uno
test_profile_file=./config/profiles/test.profile
test_profile_poll_ms=300
profile_dir=./config/profiles

# Comma-separated profile names (without extension)
bars_profiles=bars_soft,bars_balanced,bars_punchy
ring_profiles=ring_video_uno,ring_video_dos,ring_energy
render_quality=performance
particles_update_divisor=3
particle_glow_pass_cap=1
afterglow_update_divisor=3
